name: Stage verified PureGamma release assets

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Completed PureGamma native-build run ID
        type: string
        required: true
      version:
        description: Release version without the v prefix (tag puregamma-harness-v<version>)
        type: string
        required: true
        default: 0.2.2-alpha.2-pg.1

permissions:
  actions: read
  contents: write

concurrency:
  group: puregamma-stage-release
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.build_run }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Bind passing platform artifacts to the existing release
        id: verify
        run: |
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          echo "RELEASE_TAG=puregamma-harness-v$RELEASE_VERSION" >> "$GITHUB_ENV"
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > build-run.json
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/jobs?per_page=100" > build-jobs.json
          gh api "repos/$GH_REPO/releases/tags/puregamma-harness-v$RELEASE_VERSION" > release.json
          node - <<'JS'
          const fs = require('node:fs');
          const run = JSON.parse(fs.readFileSync('build-run.json'));
          const release = JSON.parse(fs.readFileSync('release.json'));
          const jobs = JSON.parse(fs.readFileSync('build-jobs.json')).jobs;
          if (run.status !== 'completed' || run.path !== '.github/workflows/puregamma-desktop-release.yml') throw Error('Expected a completed native-build workflow');
          for (const name of ['Windows x64 EXE', 'Apple Silicon macOS', 'Intel macOS']) {
            if (!jobs.some(j => j.name === name && j.conclusion === 'success')) throw Error(name + ' build and runtime checks must pass');
          }
          if (release.target_commitish !== run.head_sha) throw Error('Release must target the verified build commit');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'source_sha=' + run.head_sha + '\n');
          JS
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.verify.outputs.source_sha }}
          persist-credentials: false
      - name: Retrieve verified native artifacts
        run: |
          gh run download "$BUILD_RUN" --name puregamma-windows-x64 --dir release-assets/windows
          gh run download "$BUILD_RUN" --name puregamma-macos-arm64 --dir release-assets/mac-arm64
          gh run download "$BUILD_RUN" --name puregamma-macos-x64 --dir release-assets/mac-x64
          for asset in \
            "release-assets/windows/puregamma-harness-v$RELEASE_VERSION-windows-x64.exe" \
            "release-assets/mac-arm64/puregamma-harness-v$RELEASE_VERSION-macos-arm64.zip" \
            "release-assets/mac-x64/puregamma-harness-v$RELEASE_VERSION-macos-x64.zip"; do
            test -s "$asset" || { echo "Missing build artifact $asset" >&2; exit 1; }
          done
      - name: Archive the exact release source and all bundled plugin code
        run: |
          git archive --format=zip --prefix="PureGamma-Harness-$RELEASE_VERSION-source/" --output="release-assets/puregamma-harness-v$RELEASE_VERSION-source.zip" HEAD
          node - <<'JS'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const inventory = JSON.parse(fs.readFileSync('pg-harness/bundled-plugins/inventory.json'));
          for (const p of inventory.plugins) {
            if (crypto.createHash('sha256').update(fs.readFileSync('pg-harness/bundled-plugins/' + p.archive)).digest('hex') !== p.sha256) throw Error('Plugin archive integrity failed');
          }
          const purge = inventory.bundles.includes('dsh-purge') && inventory.plugins.find(p => p.name === 'dsh-purge');
          fs.appendFileSync(process.env.GITHUB_ENV, 'PURGE_ARCHIVE=' + (purge ? purge.archive : '') + '\n');
          JS
      - name: Collect release assets and checksums
        run: |
          mkdir -p publish
          cp release-assets/windows/*.exe release-assets/mac-arm64/*.zip release-assets/mac-x64/*.zip \
            "release-assets/puregamma-harness-v$RELEASE_VERSION-source.zip" publish/
          if [ -n "$PURGE_ARCHIVE" ]; then cp "pg-harness/bundled-plugins/$PURGE_ARCHIVE" publish/; fi
          (cd publish && sha256sum -- * > ../SHA256SUMS)
          mv SHA256SUMS publish/
          cat publish/SHA256SUMS
      - name: Upload verified installers, source, bundled dsh-purge, and checksums
        run: |
          gh release upload "$RELEASE_TAG" --clobber publish/*
