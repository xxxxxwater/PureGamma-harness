name: Publish PureGamma source and plugins to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published PureGamma release version
        required: true
        default: 0.2.1-alpha.5
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: puregamma-github-package
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@xxxxxwater'
          package-manager-cache: false
      - name: Validate release version
        shell: bash
        run: '[[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]'
      - name: Download and verify the published source distribution
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/releases/tags/puregamma-harness-v$RELEASE_VERSION" > release.json
          node - <<'JS'
          const fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync('release.json'));
          const name = `puregamma-harness-v${process.env.RELEASE_VERSION}-source.zip`;
          if (r.draft || !r.assets.some(a => a.name === name && a.state === 'uploaded' && a.size > 0)) throw Error('Publish the verified source release asset first');
          JS
          mkdir package
          gh release download "puregamma-harness-v$RELEASE_VERSION" --pattern "puregamma-harness-v$RELEASE_VERSION-source.zip" --dir package
          python3 - <<'PY'
          import zipfile,json,pathlib,hashlib,os
          root=pathlib.Path('package')
          version=os.environ['RELEASE_VERSION']
          source=root/f'puregamma-harness-v{version}-source.zip'
          with zipfile.ZipFile(source) as z:
              prefix=f'PureGamma-Harness-{version}-source/'
              inventory=json.loads(z.read(prefix+'pg-harness/bundled-plugins/inventory.json'))
              for p in inventory['plugins']:
                  assert hashlib.sha256(z.read(prefix+'pg-harness/bundled-plugins/'+p['archive'])).hexdigest()==p['sha256']
              (root/'LICENSE').write_bytes(z.read(prefix+'LICENSE'))
              assert not any(n.startswith(prefix+'.dsh/') or n.endswith(('/.env','.env.windows','.env.macos')) for n in z.namelist())
          (root/'SHA256SUMS').write_text(hashlib.sha256(source.read_bytes()).hexdigest()+'  '+source.name+'\n')
          release_url=f'https://github.com/xxxxxwater/PureGamma-harness/releases/tag/puregamma-harness-v{version}'
          manifest={'name':'@xxxxxwater/puregamma-harness','version':version,'description':'PureGamma Harness source and bundled plugins; desktop apps are on GitHub Releases','license':'MIT','repository':{'type':'git','url':'https://github.com/xxxxxwater/PureGamma-harness.git'},'homepage':release_url,'files':[source.name,'SHA256SUMS','LICENSE','README.md'],'publishConfig':{'registry':'https://npm.pkg.github.com','access':'public'}}
          (root/'package.json').write_text(json.dumps(manifest,indent=2)+'\n')
          (root/'README.md').write_text(f'# PureGamma Harness {version}\n\nComplete release source and bundled plugin code, including the quiet workspace and integrated capability navigation. Personal conversations, profiles, context records, and credentials are excluded. Verify the archive with SHA256SUMS.\n\nDesktop downloads and installation: [GitHub Releases]({release_url}).\n')
          PY
      - name: Pack the explicit source-only payload
        run: |
          cd package
          npm pack --ignore-scripts --json > ../pack.json
          node - <<'JS'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('../pack.json'))[0];
          if (p.size >= 256000000) throw Error('GitHub npm package size limit exceeded');
          const allowed = new Set(['package.json','README.md','LICENSE','SHA256SUMS',`puregamma-harness-v${process.env.RELEASE_VERSION}-source.zip`]);
          if (p.files.length !== allowed.size || !p.files.every(f => allowed.has(f.path))) throw Error('Unexpected publication payload');
          JS
      - name: Publish the package to the linked repository
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm publish "./package/xxxxxwater-puregamma-harness-$RELEASE_VERSION.tgz" --ignore-scripts --access public --tag latest --registry https://npm.pkg.github.com
      - name: Verify the published package version and integrity metadata
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm view "@xxxxxwater/puregamma-harness@$RELEASE_VERSION" version dist.shasum dist.integrity --registry https://npm.pkg.github.com --json
